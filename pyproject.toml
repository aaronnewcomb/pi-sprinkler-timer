[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-sprinkler-controller"
version = "3.0.0"
description = "Local-first sprinkler controller for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
open-sprinkler-v3 = "open_sprinkler.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_sprinkler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = ["error"]
