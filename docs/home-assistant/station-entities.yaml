# Merge these sections into Home Assistant configuration.yaml after rest.yaml.
# If either top-level key already exists, merge its children instead of
# creating a duplicate key. Rename stations and remove unused entries.

input_number:
  pi_sprinkler_duration_minutes:
    name: Pi Sprinkler watering duration
    icon: mdi:timer-outline
    min: 1
    max: 120
    step: 1
    initial: 10
    mode: box
    unit_of_measurement: min

template:
  - switch:
      - name: Pi Sprinkler Station 1
        unique_id: pi_sprinkler_station_1
        icon: mdi:sprinkler-variant
        availability: >-
          {{ has_value('sensor.pi_sprinkler_timer_active_station') }}
        state: >-
          {{ is_state('sensor.pi_sprinkler_timer_active_station', '1') }}
        turn_on:
          - action: rest_command.pi_sprinkler_start_station
            data:
              station_id: 1
              duration_seconds: >-
                {{ (states('input_number.pi_sprinkler_duration_minutes')
                    | int(10)) * 60 }}
          - delay: "00:00:01"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.pi_sprinkler_timer_active_station
        turn_off:
          - action: rest_command.pi_sprinkler_stop_station
            data:
              station_id: 1
          - delay: "00:00:01"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.pi_sprinkler_timer_active_station

