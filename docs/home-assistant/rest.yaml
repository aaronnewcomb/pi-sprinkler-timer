# Merge these sections into Home Assistant configuration.yaml.
# Store the complete Authorization value in secrets.yaml as:
# open_sprinkler_authorization: Bearer YOUR_GENERATED_TOKEN

rest:
  - resource: https://OPEN_SPRINKLER_HOST/api/v1/status
    scan_interval: 10
    timeout: 5
    headers:
      Authorization: !secret open_sprinkler_authorization
    sensor:
      - name: Pi Sprinkler Timer active station
        unique_id: open_sprinkler_active_station
        value_template: "{{ value_json.active_station_id | default('none', true) }}"
        json_attributes:
          - stations
          - active_run_id
          - active_until

rest_command:
  open_sprinkler_start_station:
    url: "https://OPEN_SPRINKLER_HOST/api/v1/stations/{{ station_id }}/start"
    method: POST
    headers:
      Authorization: !secret open_sprinkler_authorization
      Content-Type: application/json
    payload: '{"duration_seconds": {{ duration_seconds | int }}}'

  open_sprinkler_stop_station:
    url: "https://OPEN_SPRINKLER_HOST/api/v1/stations/{{ station_id }}/stop"
    method: POST
    headers:
      Authorization: !secret open_sprinkler_authorization

  open_sprinkler_stop_all:
    url: "https://OPEN_SPRINKLER_HOST/api/v1/actions/stop-all"
    method: POST
    headers:
      Authorization: !secret open_sprinkler_authorization
