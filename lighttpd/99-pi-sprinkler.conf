server.modules += ( "mod_proxy" )

proxy.forwarded = (
    "for"   => 1,
    "proto" => 1,
    "host"  => 1
)

# This Pi is a dedicated controller, so every request is sent to the local app.
proxy.server = (
    "/" => (
        "pi-sprinkler" => (
            "host" => "127.0.0.1",
            "port" => 8000
        )
    )
)
